# ─────────────────────────────────────────────────────────────
# market-info 설정 파일
# 지표를 추가·삭제·숨기려면 이 파일만 고치면 된다. (코드 수정 불필요)
#
#  public: false  → 공개 페이지·JSON에서 제외 (수집도 안 함)
#  kind: rate     → 변화량을 bp로 표시 (금리)
#  kind: level    → 변화율을 %로 표시 (지수·환율·가격)
#  kind: macro    → 월간 발표치, "이전 값"과 비교
#  step: true     → 기준금리처럼 계단식 (값이 바뀐 날만 저장)
#  intraday: 기호  → 1일(1D) 차트용 Yahoo 장중 5분 데이터
# ─────────────────────────────────────────────────────────────

site:
  title: Market Monitor
  subtitle: 금리 · 환율 · 자산 · 경제지표 · 수출
  disclaimer: 본 페이지의 정보는 참고용이며, 투자 판단의 책임은 투자자 본인에게 있습니다.

# 최초 수집 시작일 (20년 차트용으로 넉넉하게)
history_start: "2000-01-01"

# 상단 요약 띠에 보일 지표 (순서대로)
ticker: [kospi, kosdaq, spx, nasdaq, vix, cnn_fg, usdkrw, jpykrw, kr10y, us10y, wti, gold, btc]

# 기간 버튼
periods: ["1D", "1W", "1M", "3M", "1Y", "3Y", "5Y", "10Y", "20Y", "YTD"]   # 1D = 장중(5분, 최근 24시간)

sources:
  ecos:    { name: 한국은행, url: "https://ecos.bok.or.kr" }
  fred:    { name: FRED, url: "https://fred.stlouisfed.org" }
  treasury: { name: 미 재무부, url: "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve" }
  yahoo:   { name: Yahoo Finance, url: "https://finance.yahoo.com" }
  bcb:     { name: 브라질 중앙은행, url: "https://www.bcb.gov.br" }
  tesouro: { name: 브라질 국고청, url: "https://www.tesourotransparente.gov.br" }
  customs: { name: 관세청, url: "https://www.data.go.kr/data/15101609/openapi.do" }
  derived: { name: 한국은행·브라질 중앙은행, url: "" }
  cnn:     { name: CNN, url: "https://edition.cnn.com/markets/fear-and-greed" }
  alternative: { name: alternative.me, url: "https://alternative.me/crypto/fear-and-greed-index/" }
  stockhub: { name: StockHub, url: "https://stockhub.kr/fear-greed" }
  kind:    { name: KRX KIND, url: "https://kind.krx.co.kr/corpgeneral/irschedule.do?method=searchIRScheduleMain&gubun=iRSchedule" }
  naver:   { name: "네이버 금융(FnGuide 컨센서스)", url: "https://finance.naver.com" }
  nasdaq:  { name: Nasdaq, url: "https://www.nasdaq.com/market-activity/earnings" }

# ── 지표 목록 ──────────────────────────────────────────────
indicators:
  # 한국 금리 (ECOS)
  - { id: kr_base, name: 한국은행 기준금리, short: 기준금리, source: ecos, stat: 722Y001, item: "0101000", cycle: D, unit: "%", kind: rate, decimals: 2, step: true }
  - { id: kr3y,  name: 국고채 3년,  short: 3년,  source: ecos, stat: 817Y002, item: "010200000", cycle: D, unit: "%", kind: rate, decimals: 3 }
  - { id: kr10y, name: 국고채 10년, short: 10년, source: ecos, stat: 817Y002, item: "010210000", cycle: D, unit: "%", kind: rate, decimals: 3 }
  - { id: kr30y, name: 국고채 30년, short: 30년, source: ecos, stat: 817Y002, item: "010230000", cycle: D, unit: "%", kind: rate, decimals: 3 }

  # 미국 금리 (FRED)
  - { id: us_fed, name: 美 기준금리(상단), short: 기준금리(상단), source: fred, series: DFEDTARU, unit: "%", kind: rate, decimals: 2, step: true }
  # 美국채: 미 재무부 일일 금리 (FRED DGS2·10·30과 같은 숫자, 재무부는 당일 바로 게시 — FRED는 하루 늦음)
  - { id: us2y,  name: 美국채 2년,  short: 2년,  source: treasury, column: "2 Yr",  unit: "%", kind: rate, decimals: 2 }
  - { id: us10y, name: 美국채 10년, short: 10년, source: treasury, column: "10 Yr", unit: "%", kind: rate, decimals: 2, intraday: "^TNX" }
  - { id: us30y, name: 美국채 30년, short: 30년, source: treasury, column: "30 Yr", unit: "%", kind: rate, decimals: 2 }
  - { id: us_t10y2y, name: 美 장단기 금리차 (10년−2년), short: 美 10Y−2Y, source: derived, formula: [us10y, "-", us2y], source_name: "미 재무부 계산", unit: "%p", kind: rate, decimals: 2 }

  # 브라질 금리
  - { id: br_selic, name: 브라질 Selic 기준금리, short: Selic 기준금리, source: bcb, sgs: 432, unit: "%", kind: rate, decimals: 2, step: true }
  - { id: br10y, name: 브라질 국채 10년(근사), short: 10년 근사(NTN-F), source: tesouro, title_type: "Tesouro Prefixado com Juros Semestrais", target_years: 10, unit: "%", kind: rate, decimals: 2 }

  # 환율
  - { id: usdkrw, name: 원/달러, source: ecos, stat: 731Y001, item: "0000001", cycle: D, unit: 원, kind: level, decimals: 1, intraday: "KRW=X" }
  - { id: jpykrw, name: 원/100엔, source: ecos, stat: 731Y001, item: "0000002", cycle: D, unit: 원, kind: level, decimals: 2, intraday: "JPYKRW=X", intraday_scale: 100 }
  - { id: usdbrl, name: 달러/헤알, source: bcb, sgs: 1, unit: 헤알, kind: level, decimals: 4, hidden: true }   # 원/헤알 계산용
  - { id: brlkrw, name: 원/헤알, source: derived, formula: [usdkrw, "/", usdbrl], unit: 원, kind: level, decimals: 2 }
  - { id: dxy,    name: 달러인덱스 (DXY), short: DXY, source: yahoo, symbol: "DX-Y.NYB", unit: pt, kind: level, decimals: 2, public: true, intraday: "DX-Y.NYB" }

  # 주식·원자재·코인
  - { id: kospi,  name: 코스피, source: ecos, stat: 802Y001, item: "0001000", cycle: D, unit: pt, kind: level, decimals: 2, intraday: "^KS11", latest_from: "^KS11" }   # ECOS는 하루 늦게 올라옴 → 당일 종가는 Yahoo로 잠정 채움
  - { id: kosdaq, name: 코스닥, source: ecos, stat: 802Y001, item: "0089000", cycle: D, unit: pt, kind: level, decimals: 2, intraday: "^KQ11", latest_from: "^KQ11" }
  - { id: spx,    name: S&P 500,    source: yahoo, symbol: "^GSPC",  unit: pt, kind: level, decimals: 2, public: true, intraday: "^GSPC" }
  - { id: nasdaq, name: 나스닥 종합, source: yahoo, symbol: "^IXIC",  unit: pt, kind: level, decimals: 2, public: true, intraday: "^IXIC" }
  - { id: wti,    name: "WTI 유가 ($/배럴, 선물)", short: WTI, source: yahoo, symbol: "CL=F", unit: "$", kind: level, decimals: 2, public: true, intraday: "CL=F" }   # FRED(EIA 현물)는 약 1주 지연
  - { id: gold,   name: "금 ($/온스, 선물)", short: 금, source: yahoo, symbol: "GC=F", unit: "$", kind: level, decimals: 1, public: true, intraday: "GC=F" }
  - { id: btc,    name: 비트코인 ($), short: 비트코인, source: yahoo, symbol: "BTC-USD", unit: "$", kind: level, decimals: 0, public: true, intraday: "BTC-USD" }

  # 심리 지표 (개인 참고용 — 문제가 되면 public: false)
  - { id: vix,       name: VIX 변동성 지수, short: VIX, source: yahoo, symbol: "^VIX", unit: pt, kind: level, decimals: 2, public: true, intraday: "^VIX" }
  - { id: cnn_fg,    name: 美 공포·탐욕 지수 (CNN), short: 美 공포탐욕, source: cnn, unit: 점, kind: gauge, decimals: 0, public: true }
  - { id: kr_fg,     name: 韓 공포·탐욕 지수 (StockHub), short: 韓 공포탐욕, source: stockhub, field: kr, unit: 점, kind: gauge, decimals: 0, public: true }   # 최근 30일만 제공 → 매일 누적
  - { id: crypto_fg, name: 코인 공포·탐욕 지수, short: 코인 공포탐욕, source: alternative, unit: 점, kind: gauge, decimals: 0, public: true }

  # 경제지표 (월간)
  - { id: us_cpi,      name: 美 소비자물가 (전년비), short: CPI, source: fred, series: CPIAUCSL, units: pc1, cycle: M, unit: "%", kind: macro, decimals: 1 }
  - { id: us_core_cpi, name: 美 근원 소비자물가 (전년비), short: 근원 CPI, source: fred, series: CPILFESL, units: pc1, cycle: M, unit: "%", kind: macro, decimals: 1 }
  - { id: us_ppi,      name: 美 생산자물가 (전년비), source: fred, series: PPIFIS, units: pc1, cycle: M, unit: "%", kind: macro, decimals: 1 }
  - { id: us_core_pce, name: 美 근원 PCE 물가 (전년비), source: fred, series: PCEPILFE, units: pc1, cycle: M, unit: "%", kind: macro, decimals: 1 }
  - { id: us_nfp,      name: 美 비농업 고용 (전월대비), source: fred, series: PAYEMS, units: chg, cycle: M, unit: 천명, kind: macro, decimals: 0 }
  - { id: us_unrate,   name: 美 실업률, source: fred, series: UNRATE, cycle: M, unit: "%", kind: macro, decimals: 1 }
  - { id: us_retail,   name: 美 소매판매 (전월비), source: fred, series: RSAFS, units: pch, cycle: M, unit: "%", kind: macro, decimals: 1 }
  - { id: us_gdp,      name: 美 실질 GDP (전기비 연율), source: fred, series: A191RL1Q225SBEA, cycle: Q, unit: "%", kind: macro, decimals: 1, hidden: true }   # 일정 '이전' 값용
  - { id: kr_cpi,      name: 韓 소비자물가 (전년비), source: ecos, stat: 901Y009, item: "0", cycle: M, transform: yoy, unit: "%", kind: macro, decimals: 1 }
  - { id: br_ipca,     name: 브라질 IPCA (12개월 누적), source: bcb, sgs: 13522, cycle: M, unit: "%", kind: macro, decimals: 1 }

  # 품목별 수출 (관세청, HS 4단위, 억 달러)
  - { id: exp_8542, name: 반도체,     hs: "8542", source: customs, cycle: M, unit: 억$, kind: export, decimals: 1 }
  - { id: exp_8703, name: 자동차,     hs: "8703", source: customs, cycle: M, unit: 억$, kind: export, decimals: 1 }
  - { id: exp_2710, name: 석유제품,   hs: "2710", source: customs, cycle: M, unit: 억$, kind: export, decimals: 1 }
  - { id: exp_8901, name: 선박,       hs: "8901", source: customs, cycle: M, unit: 억$, kind: export, decimals: 1 }
  - { id: exp_8708, name: 자동차부품, hs: "8708", source: customs, cycle: M, unit: 억$, kind: export, decimals: 1 }
  - { id: exp_8524, name: 디스플레이, hs: "8524", source: customs, cycle: M, unit: 억$, kind: export, decimals: 1 }
  - { id: exp_8517, name: 무선통신기기, hs: "8517", source: customs, cycle: M, unit: 억$, kind: export, decimals: 1 }
  - { id: exp_8507, name: 이차전지,   hs: "8507", source: customs, cycle: M, unit: 억$, kind: export, decimals: 1 }
  - { id: exp_3304, name: 화장품,     hs: "3304", source: customs, cycle: M, unit: 억$, kind: export, decimals: 1 }
  - { id: exp_8471, name: 컴퓨터·SSD, hs: "8471", source: customs, cycle: M, unit: 억$, kind: export, decimals: 1 }

# ── 화면 구성 (섹션 → 카드 → 선) ─────────────────────────────
sections:
  - id: rates
    label: 금리
    eyebrow: RATES
    note: 국채 금리 / 점선 기준금리 · 범례를 누르면 선 켜기·끄기
    cards:
      - { title: 한국 국고채, main: kr10y, lines: [kr_base, kr3y, kr10y, kr30y], dashed: [kr_base] }
      - { title: 미국 국채,   main: us10y, lines: [us_fed, us2y, us10y, us30y], dashed: [us_fed] }
      - { main: us_t10y2y, zero: true }
      - { title: 브라질 국채, main: br10y, lines: [br_selic, br10y], dashed: [br_selic] }
  - id: fx
    label: 환율
    eyebrow: FX
    note: 원화 기준 / 원·헤알 = 원·달러 ÷ 달러·헤알
    cards:
      - { main: usdkrw }
      - { main: jpykrw }
      - { main: brlkrw }
      - { main: dxy }
  - id: assets
    label: 주식·원자재·코인
    eyebrow: EQUITY · COMMODITY · CRYPTO
    note: 종가 기준
    cards:
      - { main: kospi }
      - { main: kosdaq }
      - { main: spx }
      - { main: nasdaq }
      - { main: wti }
      - { main: gold }
      - { main: btc }
  - id: sentiment
    label: 심리지표
    eyebrow: SENTIMENT
    note: VIX · 공포·탐욕 (0 극단적 공포 ~ 100 극단적 탐욕) · CNN은 최근 1년부터 누적
    periods: ["1D", "1W", "1M", "3M", "1Y", "3Y", "5Y", "10Y", "20Y", "YTD"]
    default_period: 1Y
    cards:
      - { main: vix }
      - { main: cnn_fg, range: [0, 100] }
      - { main: kr_fg, range: [0, 100] }
      - { main: crypto_fg, range: [0, 100] }
  - id: earnings
    label: 실적발표
    eyebrow: EARNINGS
    note: 국내 KRX KIND(영업이익 컨센서스·전년 동기는 네이버 금융, 억원) · 미국 Nasdaq(시가총액 300억 달러 이상)
    type: earnings
  - id: calendar
    label: 주요 일정
    eyebrow: CALENDAR
    note: 한국시간 · 출처 FRED·각국 중앙은행
    type: calendar
  - id: macro
    label: 경제지표
    eyebrow: MACRO
    note: 월간 발표치
    periods: ["1Y", "3Y", "5Y", "10Y", "20Y"]
    cards:
      - { title: 美 소비자물가 (전년비), main: us_cpi, lines: [us_cpi, us_core_cpi] }
      - { main: us_ppi }
      - { main: us_core_pce }
      - { main: us_nfp, chart: bar }
      - { main: us_unrate }
      - { main: us_retail, chart: bar }
      - { main: kr_cpi }
      - { main: br_ipca }
  - id: exports
    label: 품목별 수출
    eyebrow: EXPORTS
    note: 관세청 HS 4단위, 억 달러 / 막대 월별 · 선 12개월 평균
    periods: ["3Y", "5Y", "10Y", "20Y"]
    type: exports
    cards:
      - { main: exp_8542 }
      - { main: exp_8703 }
      - { main: exp_2710 }
      - { main: exp_8901 }
      - { main: exp_8708 }
      - { main: exp_8524 }
      - { main: exp_8517 }
      - { main: exp_8507 }
      - { main: exp_3304 }
      - { main: exp_8471 }

# ── 실적발표 일정 (개인 참고용) ─────────────────────────────
earnings:
  enabled: true
  days: 21               # 국내: 오늘부터 며칠
  kr: true
  kr_max_consensus: 80   # 네이버 컨센서스 조회 최대 종목 수 (너무 많이 조회하지 않게)
  us: true
  us_days: 14            # 미국: 오늘부터 며칠 (날짜마다 1회 조회)
  us_min_cap_b: 30       # 미국: 시가총액 300억 달러 이상만

# ── 주요 일정 ───────────────────────────────────────────────
# 오늘부터 3주 이내 일정만 화면에 표시된다. (60일치는 docs/data/calendar.json에 저장)
# 시간: time = 한국시간, time_et = 美 동부시간(자동으로 한국시간 변환, 서머타임 반영)

# 자동 수집 (매 실행마다 공식 출처에서 갱신)
calendar_auto:
  # FRED 발표 예정일 — release_id는 FRED 시리즈 페이지의 Release 링크에서 확인 (2026-11-09)
  # 발표 시각은 각 기관 공지 기준 美 동부시간 08:30
  fred_releases:
    - { release_id: 10, event: 소비자물가(CPI), time_et: "08:30", importance: 3, prev: us_cpi, prev_note: 전년비 }
    - { release_id: 50, event: 고용보고서(비농업 고용·실업률), time_et: "08:30", importance: 3, prev: us_nfp }
    - { release_id: 46, event: 생산자물가(PPI), time_et: "08:30", importance: 2, prev: us_ppi, prev_note: 전년비 }
    - { release_id: 9,  event: 소매판매, time_et: "08:30", importance: 2, prev: us_retail, prev_note: 전월비 }
    - { release_id: 54, event: 개인소득·지출(PCE 물가), time_et: "08:30", importance: 2, prev: us_core_pce, prev_note: 근원 전년비 }
    - { release_id: 53, event: GDP, time_et: "08:30", importance: 2, prev: us_gdp, prev_note: 연율 }
  copom: true          # 브라질 중앙은행 공식 달력 API
  forexfactory: true   # ForexFactory 이번 주 컨센서스(이전·예상) — 개인 참고용 (끄려면 false)

# 컨센서스(예상치) — 직접 입력. 같은 날짜 + 일정 이름에 match 글자가 들어간 일정에 붙는다.
#  ※ ForexFactory·Investing.com은 자동 접속을 차단하고 있어 자동 수집하지 않는다 (2026-11-09 확인).
#  ※ 회사 단말기(블룸버그 등) 컨센서스는 라이선스상 공개 게시가 제한될 수 있으니, 공개해도 되는 출처의 값만 넣는다.
# 예) - { date: "2026-11-10", match: CPI, value: "전년비 3.5%" }
calendar_consensus: []

# 수동 입력 (공식 홈페이지에서 확인한 날짜만 넣는다)
#  prev: 이전 값으로 보여줄 지표 id, prev_note: 설명(선택)
calendar:
  # FOMC — federalreserve.gov/monetarypolicy/fomccalendars.htm (2026-11-09 확인). 결정문 14:00 ET
  - { date: "2026-12-09", time_et: "14:00", country: US, event: FOMC 기준금리 결정, importance: 3, prev: us_fed, prev_note: 상단 }
