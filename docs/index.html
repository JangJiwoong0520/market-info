<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Market Monitor</title>
<meta name="description" content="금리·환율·주식·원자재·경제지표·수출 대시보드 (매일 자동 업데이트)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  color-scheme:light;
  --bg:#f2f4f7;--panel:#ffffff;--bd:#dfe3ea;--bd2:#eceff3;
  --tx:#111a2b;--sub:#5a6577;--mute:#8b94a3;--grid:#edf0f4;
  --hd:#0d1b33;--hd2:#13264a;--hdtx:#ffffff;--hdsub:#9fb0cf;--acc:#3d5a99;
  --up:#d42f2f;--dn:#1e64d0;--flat:#8b94a3;
  --s1:#3d5a99;--s2:#16a372;--s3:#e08a00;--sp:#98a2b3;--bar:#9fb0cf;--bar2:#3d5a99;
  --tip:#0d1b33;--tiptx:#fff;--warn-bg:#fff4e0;--warn-tx:#8a5300;--btn-on:#0d1b33;--btn-ontx:#fff;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#0b0f16;--panel:#121924;--bd:#222c3b;--bd2:#1a2230;
    --tx:#e6ebf2;--sub:#9aa6b8;--mute:#6c788b;--grid:#1c2432;
    --hd:#0e1522;--hd2:#141e30;--hdtx:#e6ebf2;--hdsub:#7d8da6;--acc:#6f8be0;
    --up:#ff6b63;--dn:#5b9dff;--flat:#6c788b;
    --s1:#6f8be0;--s2:#199e70;--s3:#c98500;--sp:#6b7686;--bar:#4a5d80;--bar2:#6f8be0;
    --tip:#24324a;--tiptx:#e6ebf2;--warn-bg:#2b2213;--warn-tx:#f3c375;--btn-on:#e6ebf2;--btn-ontx:#0b0f16;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b0f16;--panel:#121924;--bd:#222c3b;--bd2:#1a2230;
  --tx:#e6ebf2;--sub:#9aa6b8;--mute:#6c788b;--grid:#1c2432;
  --hd:#0e1522;--hd2:#141e30;--hdtx:#e6ebf2;--hdsub:#7d8da6;--acc:#6f8be0;
  --up:#ff6b63;--dn:#5b9dff;--flat:#6c788b;
  --s1:#6f8be0;--s2:#199e70;--s3:#c98500;--sp:#6b7686;--bar:#4a5d80;--bar2:#6f8be0;
  --tip:#24324a;--tiptx:#e6ebf2;--warn-bg:#2b2213;--warn-tx:#f3c375;--btn-on:#e6ebf2;--btn-ontx:#0b0f16;
}
*{box-sizing:border-box}
html{scroll-padding-top:56px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Pretendard,'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum'}
a{color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:0 16px}

/* 헤더 */
.hd{background:var(--hd);color:var(--hdtx)}
.hd .wrap{display:flex;align-items:center;gap:10px;min-height:52px}
.hd h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-.2px;white-space:nowrap}
.hd .sub{color:var(--hdsub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .rt{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--hdsub);white-space:nowrap}
.thm{background:none;border:1px solid rgba(255,255,255,.22);color:var(--hdtx);font:inherit;font-size:12px;padding:5px 9px;border-radius:6px;cursor:pointer}
@media (max-width:560px){.hd .sub{display:none}.hd .upd{font-size:11px}}

/* 요약 띠 */
.tk{background:var(--hd2);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tk::-webkit-scrollbar{display:none}
.tk .wrap{display:flex}
.tq{padding:9px 16px 9px 0;margin-right:16px;border-right:1px solid rgba(255,255,255,.08);white-space:nowrap;line-height:1.3;text-decoration:none}
.tq:last-child{border-right:0}
.tq .n{display:block;font-size:11px;color:var(--hdsub)}
.tq .p{font-size:14px;font-weight:700;color:var(--hdtx);margin-right:5px}
.tq .c{font-size:12px;font-weight:600}
.hd2up{color:#ff7b74}.hd2dn{color:#73a8ff}.hd2flat{color:var(--hdsub)}

/* 실패 안내 */
.warn{background:var(--warn-bg);color:var(--warn-tx);font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--bd)}

/* 메뉴 */
.nav{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--bd)}
.nav .wrap{display:flex;overflow-x:auto;scrollbar-width:none}
.nav .wrap::-webkit-scrollbar{display:none}
.nav a{color:var(--sub);text-decoration:none;font-size:14px;font-weight:600;padding:13px 2px 11px;margin-right:22px;border-bottom:2px solid transparent;white-space:nowrap}
.nav a.on{color:var(--tx);border-bottom-color:var(--acc)}

/* 섹션 */
section{padding:26px 0 6px}
.sh{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:12px}
.sh .ey{font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--acc)}
.sh h2{margin:2px 0 0;font-size:21px;font-weight:800;letter-spacing:-.4px}
.sh .note{color:var(--sub);font-size:12.5px;margin-left:4px}
.per{margin-left:auto;display:flex;border:1px solid var(--bd);border-radius:7px;overflow:hidden;background:var(--panel)}
.per button{font:inherit;font-size:12.5px;font-weight:600;color:var(--sub);background:none;border:0;border-right:1px solid var(--bd);padding:7px 11px;cursor:pointer;min-width:42px}
.per button:last-child{border-right:0}
.per button.on{background:var(--btn-on);color:var(--btn-ontx)}
@media (max-width:560px){.per{margin-left:0;width:100%}.per button{flex:1;padding:8px 0;min-width:0}}

.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:860px){.grid{grid-template-columns:1fr 1fr}}
@media (min-width:1200px){.grid.g3{grid-template-columns:1fr 1fr 1fr}}

/* 카드 */
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;overflow:hidden;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px 10px}
.ch h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px}
.ch .src{font-size:12px;color:var(--mute);margin-top:2px}
.ch .src a{text-decoration:none}
.ch .val{text-align:right;white-space:nowrap}
.ch .big{font-size:22px;font-weight:800;letter-spacing:-.5px}
.ch .cap{font-size:11.5px;color:var(--mute)}
.stale{display:inline-block;font-size:11px;font-weight:600;color:var(--warn-tx);background:var(--warn-bg);border-radius:4px;padding:1px 6px;margin-left:6px}
.chg{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--bd2);border-bottom:1px solid var(--bd2)}
.chg div{padding:7px 10px 8px 16px;border-right:1px solid var(--bd2);min-width:0}
.chg div:last-child{border-right:0}
.chg .l{display:block;font-size:11px;color:var(--mute)}
.chg .v{font-size:13.5px;font-weight:700;white-space:nowrap}
@media (max-width:400px){.chg div{padding-left:10px}.chg .v{font-size:12.5px}}
.one{padding:7px 16px 8px;border-top:1px solid var(--bd2);border-bottom:1px solid var(--bd2);font-size:13px;color:var(--sub)}
.one b{color:var(--tx)}
.one b.up{color:var(--up)}.one b.dn{color:var(--dn)}
.up{color:var(--up)}.dn{color:var(--dn)}.flat{color:var(--flat)}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;padding:9px 16px 0;font-size:12px;color:var(--sub)}
.lg span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lg i{display:inline-block;width:14px;height:0;border-top:2.5px solid currentColor}
.lg i.d{border-top-style:dashed;border-top-width:2px}
.lg i.b{width:9px;height:9px;border:0;border-radius:2px}
.lg b{color:var(--tx);font-weight:700}
.cv{position:relative;height:210px;margin:4px 0 6px;touch-action:pan-y}
@media (min-width:860px){.cv{height:230px}}
.cv svg{display:block;width:100%;height:100%;overflow:visible}
.cv .msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:12.5px}
.ax{font-size:10.5px;fill:var(--mute)}
.tip{position:absolute;pointer-events:none;background:var(--tip);color:var(--tiptx);font-size:12px;padding:7px 9px;border-radius:7px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:5;display:none}
.tip .d{opacity:.75;margin-bottom:3px}
.tip .r{display:flex;align-items:center;gap:6px}
.tip .r i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tip .r b{margin-left:auto;padding-left:12px}
.cf{display:flex;justify-content:flex-end;padding:0 16px 10px;font-size:11.5px}
.cf a{color:var(--mute);text-decoration:none}

/* 일정 */
.cal{background:var(--panel);border:1px solid var(--bd);border-radius:10px;overflow:auto}
.cal table{width:100%;border-collapse:collapse;font-size:13px;min-width:460px}
.cal th{font-size:11.5px;color:var(--mute);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--bd)}
.cal td{padding:9px 12px;border-bottom:1px solid var(--bd2)}
.cal tr.day td{background:var(--bd2);font-weight:700;font-size:12.5px;padding:6px 12px}
.cal .imp{letter-spacing:1px;color:var(--acc)}
.empty{padding:22px 16px;color:var(--mute);font-size:13px;text-align:center}

footer{margin:30px 0 0;padding:20px 0 40px;border-top:1px solid var(--bd);color:var(--sub);font-size:12px;line-height:1.7}
footer a{color:var(--sub)}
footer .disc{margin-top:8px;color:var(--tx);font-weight:600}
</style>
</head>
<body>
<header class="hd">
  <div class="wrap">
    <h1 id="title">Market Monitor</h1>
    <span class="sub" id="subtitle"></span>
    <div class="rt">
      <span class="upd" id="updated">불러오는 중…</span>
      <button class="thm" id="thm" type="button" aria-label="화면 밝기 전환">화면 전환</button>
    </div>
  </div>
</header>
<div class="tk"><div class="wrap" id="ticker"></div></div>
<div class="warn" id="warn" hidden><div class="wrap" id="warnText"></div></div>
<nav class="nav"><div class="wrap" id="nav"></div></nav>
<main class="wrap" id="main"></main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
"use strict";
const DATA = "data/";
let M = null;                 // manifest
const SERIES = {};            // id → [[date, value], ...]
const LOADING = {};
const CHARTS = [];            // {el, card, section}
const PERIOD = {};            // section id → period

// ── 테마 ────────────────────────────────────────────
(function(){
  let t=null; try{t=localStorage.getItem("theme")}catch(e){}
  if(t) document.documentElement.setAttribute("data-theme",t);
  document.getElementById("thm").onclick=()=>{
    const cur=document.documentElement.getAttribute("data-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    const next=cur==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem("theme",next)}catch(e){}
  };
})();

// ── 숫자·날짜 형식 ─────────────────────────────────
function fmt(v,dec){ if(v==null||isNaN(v)) return "–"; return Number(v).toLocaleString("ko-KR",{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function fmtVal(ind,v){ const u=ind.unit; const s=fmt(v,ind.decimals); return u==="%"?s+"%":u==="억$"?s+"억$":u==="천명"?s+"천명":s; }
function fmtDate(d){ if(!d) return "–"; return d.length===7? d.replace("-","."): d.slice(2).replace(/-/g,"."); }
function dir(x){ return x==null?"flat": x>0?"up": x<0?"dn":"flat"; }
function arrow(x){ return x>0?"▲":x<0?"▼":"–"; }
function fmtChg(kind,x,long){
  if(x==null) return "–";
  if(kind==="rate"){ const r=Math.round(Math.abs(x)); return `${arrow(Math.round(x))} ${r}bp`; }
  const a=Math.abs(x); return `${arrow(x)} ${a.toFixed(long?1:2)}%`;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// ── 시작 ────────────────────────────────────────────
fetch(DATA+"manifest.json",{cache:"no-cache"}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(m=>{ M=m; render(); })
  .catch(e=>{ document.getElementById("main").innerHTML=`<div class="empty">데이터를 불러오지 못했습니다 (${esc(e.message)}). 잠시 후 새로고침 해주세요.</div>`; document.getElementById("updated").textContent="불러오기 실패"; });

function render(){
  const I=M.indicators;
  document.getElementById("title").textContent=M.site.title;
  document.getElementById("subtitle").textContent=M.site.subtitle||"";
  document.getElementById("updated").textContent=M.updated_at+" 기준";
  document.title=`${M.site.title} ${M.updated_at.slice(5,10).replace("-","/")}`;

  // 요약 띠
  document.getElementById("ticker").innerHTML=M.ticker.map(id=>{
    const ind=I[id]; const s=ind.summary||{}; const c=s.chg?s.chg["1D"]:null;
    return `<a class="tq" href="#c-${id}"><span class="n">${esc(ind.short)}</span><span class="p">${fmtVal({...ind,unit:ind.unit==="%"?"%":""},s.value)}</span><span class="c hd2${dir(c)}">${fmtChg(ind.kind,c)}</span></a>`;
  }).join("");

  // 실패 안내
  if(M.failed&&M.failed.length){
    document.getElementById("warn").hidden=false;
    document.getElementById("warnText").textContent=`⚠ 업데이트 실패 ${M.failed.length}건: ${M.failed.map(f=>f.name).join(", ")} — 이전 데이터와 기준일을 표시합니다.`;
  }

  // 메뉴 + 섹션
  document.getElementById("nav").innerHTML=M.sections.map((s,i)=>`<a href="#${s.id}" data-s="${s.id}"${i?"":" class=on"}>${esc(s.label)}</a>`).join("");
  const main=document.getElementById("main");
  main.innerHTML=M.sections.map(sectionHTML).join("");
  M.sections.forEach(s=>{
    const periods=s.periods||M.periods;
    PERIOD[s.id]=periods.includes("10Y")?"10Y":periods[periods.length-1];
    if(s.type==="exports"||s.id==="macro") PERIOD[s.id]="5Y";
    const box=document.getElementById("per-"+s.id);
    if(box){
      box.innerHTML=periods.map(p=>`<button type="button" data-p="${p}"${p===PERIOD[s.id]?" class=on":""}>${p==="YTD"?"YTD":p.replace("Y","년")}</button>`).join("");
      box.onclick=e=>{ const b=e.target.closest("button"); if(!b) return;
        PERIOD[s.id]=b.dataset.p; box.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
        CHARTS.filter(c=>c.section.id===s.id&&c.drawn).forEach(queueDraw); };
    }
    (s.cards||[]).forEach(card=>{
      const el=document.getElementById(`cv-${card.main}`);
      if(el) CHARTS.push({el,card,section:s,drawn:false});
    });
  });

  // 화면에 가까워지면 데이터 불러와 차트 그리기 (폰 데이터 절약)
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting) return; io.unobserve(e.target);
    const c=CHARTS.find(x=>x.el===e.target); if(c) loadAndDraw(c);
  }),{rootMargin:"600px 0px"});
  CHARTS.forEach(c=>io.observe(c.el));

  // 메뉴 강조
  const links=[...document.querySelectorAll(".nav a")];
  // ※ scrollIntoView는 페이지 전체를 움직여 휠 스크롤과 충돌하므로, 메뉴 줄만 가로로 이동한다
  const navBox=document.querySelector(".nav .wrap"); let curSec="";
  const so=new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting||e.target.id===curSec) return;
    curSec=e.target.id;
    links.forEach(a=>a.classList.toggle("on",a.dataset.s===curSec));
    const on=links.find(a=>a.dataset.s===curSec); if(!on) return;
    const l=on.offsetLeft-navBox.offsetLeft, r=l+on.offsetWidth;
    if(l<navBox.scrollLeft||r>navBox.scrollLeft+navBox.clientWidth) navBox.scrollTo({left:Math.max(0,l-16),behavior:"smooth"});
  }),{rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll("main section").forEach(s=>so.observe(s));

  renderFooter();
  let rt, lastW=innerWidth;
  addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{
    if(innerWidth===lastW) return;          // 높이만 바뀐 경우(아이폰 주소창 숨김 등)는 무시
    lastW=innerWidth; CHARTS.filter(c=>c.drawn).forEach(queueDraw);
  },200); });
  // 메뉴·요약 띠 클릭 시에만 부드럽게 이동
  document.addEventListener("click",e=>{
    const a=e.target.closest('a[href^="#"]'); if(!a) return;
    const t=document.getElementById(a.getAttribute("href").slice(1)); if(!t) return;
    e.preventDefault();
    scrollTo({top:t.getBoundingClientRect().top+scrollY-52,behavior:"smooth"});
  });
  addEventListener("scroll",()=>{ if(openTip){ openTip(); openTip=null; } },{passive:true});
}

function sectionHTML(s){
  const head=`<div class="sh"><div><div class="ey">${esc(s.eyebrow||"")}</div><h2>${esc(s.label)}<span class="note">${esc(s.note||"")}</span></h2></div>${s.type==="calendar"?"":`<div class="per" id="per-${s.id}" role="group" aria-label="기간 선택"></div>`}</div>`;
  if(s.type==="calendar") return `<section id="${s.id}">${head}${calendarHTML()}</section>`;
  const g3=(s.cards||[]).every(c=>!c.lines||c.lines.length<2)&&s.type!=="exports"&&s.id!=="macro";
  return `<section id="${s.id}">${head}<div class="grid${g3?" g3":""}">${(s.cards||[]).map(c=>cardHTML(c,s)).join("")}</div></section>`;
}

const LINE_COLORS=["--s1","--s2","--s3"];
function lineStyle(card){   // 선별 색: 점선(기준금리)=회색, 나머지는 고정 순서
  const out={}; let k=0;
  const order=[card.main,...card.lines.filter(l=>l!==card.main&&!(card.dashed||[]).includes(l))];
  order.forEach(id=>{ out[id]={color:LINE_COLORS[k++%3],dash:false}; });
  (card.dashed||[]).forEach(id=>{ out[id]={color:"--sp",dash:true}; });
  return out;
}

function cardHTML(card,s){
  const I=M.indicators, ind=I[card.main], sm=ind.summary||{};
  const title=card.title||ind.name;
  const stale=ind.status!=="ok"?`<span class="stale">업데이트 실패 · ${fmtDate(sm.date)} 기준</span>`:"";
  const multi=card.lines.length>1;
  const cap=multi?`${esc(ind.short)} · 최근`:"최근";
  let mid="";
  if(ind.kind==="rate"||ind.kind==="level"){
    const c=sm.chg||{};
    mid=`<div class="chg">${["1D","1M","1Y","YTD"].map((k,i)=>`<div><span class="l">${["1일","1개월","1년","연초"][i]}</span><span class="v ${dir(c[k])}">${fmtChg(ind.kind,c[k],i>0)}</span></div>`).join("")}</div>`;
  }else if(ind.kind==="macro"){
    mid=`<div class="one">이전 <b>${fmtVal(ind,sm.prev)}</b></div>`;
  }else if(ind.kind==="export"){
    const y=sm.yoy; mid=`<div class="one">전년 같은 달 대비 <b class="${dir(y)}">${y==null?"–":(y>0?"+":"")+y.toFixed(1)+"%"}</b></div>`;
  }
  const st=lineStyle(card);
  let lg="";
  if(s.type==="exports") lg=`<div class="lg"><span><i class="b" style="background:var(--bar)"></i>월 수출</span><span><i style="color:var(--bar2)"></i>12개월 평균</span></div>`;
  else if(multi) lg=`<div class="lg">${card.lines.map(id=>`<span><i class="${st[id].dash?"d":""}" style="color:var(${st[id].color})"></i>${esc(I[id].short)} <b>${fmtVal(I[id],(I[id].summary||{}).value)}</b></span>`).join("")}</div>`;
  const src=I[card.main].source;
  return `<article class="card" id="c-${card.main}">
    <div class="ch"><div><h3>${esc(title)}</h3><div class="src">${esc(src)} · ${fmtDate(sm.date)}${stale}</div></div>
      <div class="val"><div class="big">${fmtVal(ind,sm.value)}</div><div class="cap">${cap}</div></div></div>
    ${mid}${lg}
    <div class="cv" id="cv-${card.main}"><div class="msg">차트 불러오는 중…</div></div>
    <div class="cf"><a href="${DATA}${card.main}.json" target="_blank" rel="noopener">원본 데이터(JSON)</a></div>
  </article>`;
}

function calendarHTML(){
  const rows=M.calendar||[];
  if(!rows.length) return `<div class="cal"><div class="empty">앞으로 3주 안에 등록된 일정이 없습니다.</div></div>`;
  const W="일월화수목금토";
  let html=`<div class="cal"><table><thead><tr><th>시간(KST)</th><th>국가</th><th>일정</th><th>중요도</th></tr></thead><tbody>`, last="";
  rows.forEach(r=>{
    if(r.date!==last){ const d=new Date(r.date+"T00:00:00"); html+=`<tr class="day"><td colspan="4">${r.date.slice(5).replace("-",".")} (${W[d.getDay()]})</td></tr>`; last=r.date; }
    html+=`<tr><td>${esc(r.time||"")}</td><td>${esc(r.country||"")}</td><td>${esc(r.event)}</td><td class="imp">${"●".repeat(r.importance||1)}</td></tr>`;
  });
  return html+`</tbody></table></div>`;
}

function renderFooter(){
  const src=Object.values(M.sources).filter(s=>s.url).map(s=>`<a href="${s.url}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join(" · ");
  document.getElementById("foot").innerHTML=`출처: ${src}<br>
  금리 변화는 bp(0.01%p), 그 밖의 변화는 % · ▲ 상승(빨강) / ▼ 하락(파랑) · 기준일은 각 출처의 최신 발표일<br>
  브라질 국채 10년은 국고청(Tesouro Direto) 고정금리 이표채(NTN-F) 중 잔존만기 10년에 가장 가까운 종목의 매수 금리 · 금은 COMEX 선물 근월물<br>
  품목별 수출은 관세청 HS 4단위 합계로 산업부 품목 분류와 다를 수 있음 · 원/헤알 = 원/달러 ÷ 달러/헤알(PTAX)<br>
  <div class="disc">${esc(M.site.disclaimer)}</div>`;
}

// ── 데이터 불러오기 ────────────────────────────────
function loadSeries(id){
  if(SERIES[id]) return Promise.resolve(SERIES[id]);
  if(!LOADING[id]) LOADING[id]=fetch(DATA+id+".json",{cache:"no-cache"}).then(r=>r.json()).then(j=>(SERIES[id]=j.series||[]));
  return LOADING[id];
}
function loadAndDraw(c){
  Promise.all(c.card.lines.map(loadSeries)).then(()=>{ c.drawn=true; queueDraw(c); })
    .catch(()=>{ c.el.innerHTML=`<div class="msg">차트 데이터를 불러오지 못했습니다</div>`; });
}

// ── 그리기 대기열: 한 프레임에 하나씩 그려 스크롤이 멈추지 않게 ──
const QUEUE=new Set(); let qRun=false, openTip=null;
function queueDraw(c){ QUEUE.add(c); if(!qRun){ qRun=true; requestAnimationFrame(runQueue); } }
function runQueue(){
  const t0=performance.now();
  for(const c of QUEUE){ QUEUE.delete(c); drawChart(c); if(performance.now()-t0>6) break; }
  if(QUEUE.size) requestAnimationFrame(runQueue); else qRun=false;
}

// ── 기간 계산 ──────────────────────────────────────
function startKey(period,lastKey){
  const monthly=lastKey.length===7;
  const y=+lastKey.slice(0,4), m=+lastKey.slice(5,7), d=monthly?1:+lastKey.slice(8,10);
  if(period==="YTD") return monthly?`${y}-01`:`${y}-01-01`;
  const n=parseInt(period); const sy=y-n;
  const p=v=>String(v).padStart(2,"0");
  return monthly?`${sy}-${p(m)}`:`${sy}-${p(m)}-${p(d)}`;
}
const toT=k=>Date.UTC(+k.slice(0,4),+k.slice(5,7)-1,k.length===7?15:+k.slice(8,10));

// ── 차트 그리기 (SVG) ─────────────────────────────
function niceTicks(lo,hi,n){
  if(lo===hi){ lo-=1; hi+=1; }
  const span=hi-lo, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const err=step0/mag, step=(err>=7.5?10:err>=3.5?5:err>=1.5?2:1)*mag;
  const t=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+step*1e-9; v+=step) t.push(+v.toFixed(10));
  return {ticks:t,step};
}
function thin(pts,maxN){   // 픽셀보다 점이 많으면 구간별 최소·최대만 남김 (모양 유지)
  if(pts.length<=maxN) return pts;
  const b=Math.ceil(pts.length/(maxN/2)), out=[];
  for(let i=0;i<pts.length;i+=b){
    let lo=pts[i],hi=pts[i];
    for(let j=i;j<Math.min(i+b,pts.length);j++){ if(pts[j][1]<lo[1]) lo=pts[j]; if(pts[j][1]>hi[1]) hi=pts[j]; }
    if(lo[0]<=hi[0]){ out.push(lo); if(hi!==lo) out.push(hi); } else { out.push(hi); out.push(lo); }
  }
  const last=pts[pts.length-1]; if(out[out.length-1]!==last) out.push(last);
  return out;
}

function drawChart(c){
  const {el,card,section}=c, I=M.indicators;
  const isExp=section.type==="exports", isBar=card.chart==="bar";
  const W=el.clientWidth, H=el.clientHeight; if(!W) return;
  const padL=16, padT=10, padB=22;
  const st=lineStyle(card);
  const mainS=SERIES[card.main]||[]; if(!mainS.length){ el.innerHTML=`<div class="msg">데이터 없음</div>`; return; }
  // 기간 기준: 카드 안 시리즈 중 가장 늦은 날짜
  const lastKey=card.lines.map(id=>(SERIES[id]||[]).slice(-1)[0]?.[0]||"").sort().pop();
  const sk=startKey(PERIOD[section.id],lastKey);
  const lines=card.lines.map(id=>{
    const all=SERIES[id]||[]; const ind=I[id];
    let pts=all.filter(p=>p[0]>=sk);
    if(ind.step){   // 계단식: 시작 직전 값으로 시작점 채움
      const before=all.filter(p=>p[0]<sk).pop(); if(before) pts=[[sk,before[1]],...pts];
    }
    return {id,ind,pts,style:st[id]||{color:"--s1",dash:false}};
  }).filter(l=>l.pts.length);
  if(!lines.length){ el.innerHTML=`<div class="msg">선택한 기간에 데이터가 없습니다</div>`; return; }

  // 12개월 평균(수출)
  let avg=null;
  if(isExp){
    const all=SERIES[card.main];
    avg=all.map((p,i)=>i>=11?[p[0],all.slice(i-11,i+1).reduce((a,b)=>a+b[1],0)/12]:null).filter(p=>p&&p[0]>=sk);
  }

  const t0=toT(sk<lines[0].pts[0][0]?sk:lines[0].pts[0][0]), t1=toT(lastKey);
  const tmin=Math.min(t0,...lines.map(l=>toT(l.pts[0][0])));
  let vals=lines.flatMap(l=>l.pts.map(p=>p[1])); if(avg) vals=vals.concat(avg.map(p=>p[1]));
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(isBar||isExp){ lo=Math.min(0,lo); hi=Math.max(0,hi); }
  const padV=(hi-lo)*0.08||1; if(!(isBar||isExp)||lo<0) lo-=padV; hi+=padV;
  const {ticks}=niceTicks(lo,hi,4);
  lo=Math.min(lo,ticks[0]); hi=Math.max(hi,ticks[ticks.length-1]);
  const dec0=Math.max(0,-Math.floor(Math.log10((ticks[1]-ticks[0])||1)));
  const tickLab=v=>fmt(v,Math.min(dec0,2));
  const padR=Math.max(34,Math.max(...ticks.map(v=>tickLab(v).length))*6.4+12);   // y축 숫자 길이에 맞춰 여백
  const X=t=>padL+(t-tmin)/((t1-tmin)||1)*(W-padL-padR);
  const Y=v=>padT+(hi-v)/((hi-lo)||1)*(H-padT-padB);

  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(card.title||I[card.main].name)} 차트">`;
  ticks.forEach(v=>{ const y=Y(v); svg+=`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" style="stroke:var(${"--grid"})" stroke-width="1"/><text class="ax" x="${W-padR+6}" y="${y+3.5}">${tickLab(v)}</text>`; });
  // x축 눈금
  const spanY=(t1-tmin)/(365.25*864e5);
  const xt=[]; const sy=new Date(tmin).getUTCFullYear(), ey=new Date(t1).getUTCFullYear();
  if(spanY>2.5){ const stepY=spanY>14?5:spanY>6?2:1; for(let y=Math.ceil(sy/stepY)*stepY;y<=ey;y+=stepY){ const t=Date.UTC(y,0,1); if(t>=tmin) xt.push([t,String(y)]); } }
  else { const stepM=spanY>1.2?6:spanY>0.5?3:1; for(let y=sy;y<=ey;y++) for(let m=0;m<12;m+=stepM){ const t=Date.UTC(y,m,1); if(t>=tmin&&t<=t1) xt.push([t,m===0?`${y}`:`${m+1}월`]); } }
  xt.forEach(([t,lab])=>{ const x=X(t); if(x<padL+10||x>W-padR-10) return; svg+=`<line x1="${x}" x2="${x}" y1="${padT}" y2="${H-padB}" style="stroke:var(${"--grid"})" stroke-width="1"/><text class="ax" x="${x}" y="${H-6}" text-anchor="middle">${lab}</text>`; });

  // 막대 (수출·월간 막대형)
  if(isExp||isBar){
    const s=lines[0]; const n=s.pts.length; const slot=(W-padL-padR)/Math.max(n,1);
    const bw=Math.max(1,Math.min(24,slot-(slot>4?2:0))); const y0=Y(0);
    s.pts.forEach(p=>{ const x=X(toT(p[0]))-bw/2, y=Y(p[1]); const top=Math.min(y,y0), h=Math.max(1,Math.abs(y0-y));
      svg+=`<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${bw>6?2:0}" style="fill:var(${isExp?"--bar":"--s1"})"${isBar?' opacity=".85"':""}/>`; });
    svg+=`<line x1="${padL}" x2="${W-padR}" y1="${y0}" y2="${y0}" style="stroke:var(${"--mute"})" stroke-width="1"/>`;
    if(avg&&avg.length) svg+=`<path d="${avg.map((p,i)=>(i?"L":"M")+X(toT(p[0])).toFixed(1)+","+Y(p[1]).toFixed(1)).join("")}" fill="none" style="stroke:var(${"--bar2"})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }else{
    // 선 (점선·계단식 먼저 → 실선을 위에)
    const order=[...lines].sort((a,b)=>(b.style.dash?1:0)-(a.style.dash?1:0));
    const maxN=Math.round(W-padL-padR);
    order.forEach(l=>{
      const pts=l.ind.step?l.pts:thin(l.pts,maxN);
      let d="";
      pts.forEach((p,i)=>{ const x=X(toT(p[0])).toFixed(1), y=Y(p[1]).toFixed(1);
        if(!i) d+=`M${x},${y}`; else if(l.ind.step) d+=`H${x}V${y}`; else d+=`L${x},${y}`; });
      if(l.ind.step) d+=`H${X(t1).toFixed(1)}`;
      svg+=`<path d="${d}" fill="none" style="stroke:var(${l.style.color})" stroke-width="${l.style.dash?1.6:2}" ${l.style.dash?'stroke-dasharray="5 4"':""} stroke-linejoin="round" stroke-linecap="round"/>`;
    });
    // 끝점
    order.forEach(l=>{ const p=l.pts[l.pts.length-1]; const x=l.ind.step?X(t1):X(toT(p[0]));
      svg+=`<circle cx="${x.toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="4" style="fill:var(${l.style.color});stroke:var(--panel)" stroke-width="2"/>`; });
  }
  svg+=`<g class="hov"></g></svg><div class="tip"></div>`;
  el.innerHTML=svg;

  // ── 터치·마우스 툴팁 ──
  const tip=el.querySelector(".tip"), hov=el.querySelector(".hov"), svgEl=el.querySelector("svg");
  const ser=isExp?[{lab:"월 수출",color:"--bar",pts:lines[0].pts,ind:lines[0].ind},{lab:"12개월 평균",color:"--bar2",pts:avg||[],ind:lines[0].ind}]
           :lines.map(l=>({lab:l.ind.short,color:l.style.color,pts:l.pts,ind:l.ind,step:l.ind.step}));
  const allKeys=[...new Set(ser.flatMap(s=>s.pts.map(p=>p[0])))].sort();
  function valAt(s,key){ let lo2=0,hi2=s.pts.length-1,a=null; while(lo2<=hi2){const m=(lo2+hi2)>>1; if(s.pts[m][0]<=key){a=s.pts[m];lo2=m+1;}else hi2=m-1;} return a&&(s.step||a[0]===key||key.length===7?a: (toT(key)-toT(a[0])<6*864e5?a:null)); }
  function show(clientX){
    const r=svgEl.getBoundingClientRect(); const x=clientX-r.left;
    const t=tmin+(x-padL)/(W-padL-padR)*(t1-tmin);
    let lo2=0,hi2=allKeys.length-1; while(lo2<hi2){const m=(lo2+hi2)>>1; if(toT(allKeys[m])<t) lo2=m+1; else hi2=m;}
    let k=allKeys[lo2]; if(lo2>0&&Math.abs(toT(allKeys[lo2-1])-t)<Math.abs(toT(k)-t)) k=allKeys[lo2-1];
    if(!k) return;
    const xx=X(toT(k));
    let g=`<line x1="${xx}" x2="${xx}" y1="${padT}" y2="${H-padB}" style="stroke:var(${"--mute"})" stroke-width="1"/>`;
    let rows="";
    ser.forEach(s=>{ const v=valAt(s,k); if(!v) return;
      if(!isExp&&!isBar) g+=`<circle cx="${xx}" cy="${Y(v[1])}" r="4" style="fill:var(${s.color});stroke:var(--panel)" stroke-width="2"/>`;
      rows+=`<div class="r"><i style="background:var(${s.color})"></i>${esc(s.lab)}<b>${fmtVal(s.ind,v[1])}</b></div>`; });
    hov.innerHTML=g;
    tip.innerHTML=`<div class="d">${fmtDate(k)}</div>${rows}`; tip.style.display="block";
    const tw=tip.offsetWidth; let left=xx+12; if(left+tw>W) left=xx-12-tw; if(left<0) left=0;
    tip.style.left=left+"px"; tip.style.top="4px";
  }
  function hide(){ tip.style.display="none"; hov.innerHTML=""; }
  el.onpointermove=e=>{ if(e.pointerType==="mouse"||e.buttons) { show(e.clientX); openTip=hide; } };
  el.onclick=e=>{ show(e.clientX); openTip=hide; };
  el.onpointerleave=e=>{ if(e.pointerType==="mouse") hide(); };
}
</script>
</body>
</html>
